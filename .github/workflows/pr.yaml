name: PR

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    uses: ./.github/workflows/lint.yaml

  unit-test:
    name: unit-test
    needs:
      - lint
    uses: ./.github/workflows/unit-tests.yaml

  pr-smoke:
    name: pr-smoke
    needs:
      - unit-test
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/pr-comment-smoke.yaml
    with:
      decorate-pr: true
      comment-identifier: dogfood
