name: Tofu Happy Path Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  valid-configs:
    name: Happy Path (${{ matrix.test-case.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-case:
          - name: "Basic validation"
            workdir: "test/valid"
            env: "basic"

          - name: "With tfvar file"
            workdir: "test/valid"
            tfvar-files: "test.tfvars"
            env: "tfvar-file"

          - name: "With single inline tfvar"
            workdir: "test/valid"
            tfvars: "env=test"
            env: "single-inline-tfvar"

          - name: "With multiline tfvars"
            workdir: "test/valid"
            tfvars: |
              env=staging
              region=eu-west-1
            env: "multiline-tfvars"

          - name: "With multiline backend config"
            workdir: "test/valid"
            backend-config-vars: |
              path=custom.tfstate
            env: "multiline-backend-config-vars"

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Run Tofu Action - ${{ matrix.test-case.name }}
        id: tf-action-valid-test
        uses: ./
        with:
          workdir: ${{ matrix.test-case.workdir }}
          tfvar-files: ${{ matrix.test-case.tfvar-files }}
          tfvars: ${{ matrix.test-case.tfvars }}
          backend-config-vars: ${{ matrix.test-case.backend-config-vars }}
          env: ${{ matrix.test-case.env }}
          steps: validate,plan,apply
          comment-mode: off

      - name: Verify action succeeded
        run: |
          if [ "${{ steps.tf-action-valid-test.outcome }}" != "success" ]; then
            echo "❌ Test failed: ${{ matrix.test-case.name }}"
            exit 1
          else
            echo "✅ Test passed: ${{ matrix.test-case.name }}"
          fi
