name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint:types

      - name: Validate Security Assets
        run: npm run validate:security-assets

      - name: Run tests
        run: npm test

      - name: Build dist bundles
        run: npm run build

      - name: Verify committed dist bundles
        run: npm run verify:dist

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
