name: Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint:types

      - name: Validate Security Assets
        run: npm run validate:security-assets

      - name: Build dist bundles
        run: npm run build

      - name: Verify committed dist bundles
        run: npm run verify:dist
