name: Tofu PR Dogfood

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-dogfood:
    name: PR Dogfood (${{ matrix.case.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case:
          - name: Deploy
            workdir: test/valid
            env: dogfood-deploy
            steps: validate,plan,apply
            test-dir: ''
            expected_outcome: success
            expected_markers: checks,plan,apply
          - name: Validate Failure
            workdir: test/invalid
            env: dogfood-invalid
            steps: validate
            test-dir: ''
            expected_outcome: failure
            expected_markers: checks
          - name: Security Scan
            workdir: test/scan
            env: dogfood-scan
            steps: trivy,checkov
            test-dir: ''
            expected_outcome: failure
            expected_markers: checks
          - name: Unit Tests
            workdir: test/valid
            env: dogfood-tests
            steps: test
            test-dir: tests/unit
            expected_outcome: success
            expected_markers: checks

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Run dogfood case
        id: first-run
        continue-on-error: ${{ matrix.case.expected_outcome == 'failure' }}
        uses: ./
        with:
          workdir: ${{ matrix.case.workdir }}
          env: ${{ matrix.case.env }}
          steps: ${{ matrix.case.steps }}
          test-dir: ${{ matrix.case.test-dir }}
          summary-mode: redacted
          skip-plan-upload: true
          comment-mode: sticky
          comment-identifier: dogfood

      - name: Run dogfood case again to verify sticky updates
        id: second-run
        continue-on-error: ${{ matrix.case.expected_outcome == 'failure' }}
        uses: ./
        with:
          workdir: ${{ matrix.case.workdir }}
          env: ${{ matrix.case.env }}
          steps: ${{ matrix.case.steps }}
          test-dir: ${{ matrix.case.test-dir }}
          summary-mode: redacted
          skip-plan-upload: true
          comment-mode: sticky
          comment-identifier: dogfood

      - name: Verify expected action outcome
        run: |
          first="${{ steps.first-run.outcome }}"
          second="${{ steps.second-run.outcome }}"
          expected="${{ matrix.case.expected_outcome }}"

          if [ "$expected" = "success" ]; then
            if [ "$first" != "success" ] || [ "$second" != "success" ]; then
              echo "❌ Expected successful dogfood runs for ${{ matrix.case.name }}"
              exit 1
            fi
          else
            if [ "$first" != "failure" ] || [ "$second" != "failure" ]; then
              echo "❌ Expected failing dogfood runs for ${{ matrix.case.name }}"
              exit 1
            fi
          fi

      - name: Verify sticky PR comments
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_IDENTIFIER: dogfood
          ENV_SLUG: ${{ matrix.case.env }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_MARKERS: ${{ matrix.case.expected_markers }}
        run: |
          comments_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100")"
          COMMENTS_JSON="$comments_json" node <<'EOF'
          const comments = JSON.parse(process.env.COMMENTS_JSON ?? '[]');
          const identifier = process.env.COMMENT_IDENTIFIER;
          const envSlug = process.env.ENV_SLUG;
          const markers = (process.env.EXPECTED_MARKERS ?? '')
            .split(',')
            .map((value) => value.trim())
            .filter(Boolean);
          const headings = {
            checks: '### 🧪 Tofu Checks',
            plan: '### 🏗️ Tofu Plan',
            apply: '### 🚀 Tofu Apply',
          };

          for (const kind of markers) {
            const marker = `<!-- ${identifier}:${kind}:${envSlug} -->`;
            const matches = comments.filter((comment) => typeof comment.body === 'string' && comment.body.includes(marker));
            if (matches.length !== 1) {
              console.error(`Expected exactly one sticky comment for ${marker}, found ${matches.length}.`);
              process.exit(1);
            }

            const expectedHeading = headings[kind];
            if (!expectedHeading || !matches[0].body.includes(expectedHeading)) {
              console.error(`Sticky comment for ${marker} is missing heading ${expectedHeading ?? kind}.`);
              process.exit(1);
            }
          }
          EOF
