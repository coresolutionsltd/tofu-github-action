name: Tofu GitHub Action
description: Validate, plan, apply, test, lint, and scan OpenTofu configuration with sticky PR comments and workflow summaries.

branding:
  icon: arrow-up
  color: yellow

inputs:
  version:
    description: Exact OpenTofu version to install.
    required: false
    default: 1.11.2
  tofu-checksums:
    description: Optional newline-delimited SHA256 checksums for a custom OpenTofu version. Required when overriding `version`.
    required: false
    default: ''
  workdir:
    description: Path to the OpenTofu configuration directory, relative to the repository root.
    required: false
    default: .
  env:
    description: Logical deployment label used for sticky comment scoping, artifact naming, and plan/apply correlation.
    required: false
    default: ''
  steps:
    description: Comma or newline separated steps to run. Allowed values are `validate`, `plan`, `apply`, `test`, `lint`, `trivy`, and `checkov`.
    required: false
    default: validate,plan
  tfvar-files:
    description: Comma or newline separated list of tfvar files to include.
    required: false
    default: ''
  tfvars:
    description: Newline-delimited `key=value` pairs for Terraform variables.
    required: false
    default: ''
  backend-config-var-files:
    description: Comma or newline separated list of backend config files to include.
    required: false
    default: ''
  backend-config-vars:
    description: Newline-delimited `key=value` pairs for backend configuration.
    required: false
    default: ''
  test-dir:
    description: Directory containing OpenTofu tests, relative to `workdir`.
    required: false
    default: tests
  test-tfvar-files:
    description: Comma or newline separated list of tfvar files to include for tests. Defaults to `tfvar-files`.
    required: false
    default: ''
  test-tfvars:
    description: Newline-delimited `key=value` pairs for test variables. Defaults to `tfvars`.
    required: false
    default: ''
  tflint-version:
    description: Exact TFLint version to install.
    required: false
    default: 0.55.1
  tflint-checksums:
    description: Optional newline-delimited SHA256 checksums for a custom TFLint version. Required when overriding `tflint-version`.
    required: false
    default: ''
  trivy-version:
    description: Exact Trivy version to install. Defaults to the post-incident safe `0.69.3` release.
    required: false
    default: 0.69.3
  trivy-checksums:
    description: Optional newline-delimited SHA256 checksums for a custom Trivy version. Required when overriding `trivy-version`.
    required: false
    default: ''
  checkov-version:
    description: >-
      Exact Checkov version to install. Pinned to the version whose
      hash-locked pip requirements file ships in `security/checkov/`;
      only that version will install successfully. To upgrade, add a new
      locked requirements file under `security/checkov/<version>/` and
      update this default. The bundled lock file currently supports `3.2.497`.
    required: false
    default: 3.2.497
  trivy-scan-type:
    description: Trivy scan type. Allowed values are `config` and `fs`.
    required: false
    default: config
  checkov-skip-checks:
    description: Comma or newline separated list of Checkov checks to skip.
    required: false
    default: ''
  lock-timeout:
    description: State lock timeout for plan/apply, for example `5m`.
    required: false
    default: ''
  parallelism:
    description: Parallelism for plan/apply.
    required: false
    default: ''
  refresh:
    description: Refresh behavior for plan/apply. Allowed values are `true` and `false`.
    required: false
    default: ''
  targets:
    description: Comma or newline separated list of target resources for plan/apply.
    required: false
    default: ''
  artifact-retention-days:
    description: Retention days for uploaded plan artifacts, from 1 to 90. Empty uses the repository default.
    required: false
    default: ''
  skip-plan-upload:
    description: Skip uploading the generated plan artifact. Defaults to false so follow-up apply jobs can download it.
    required: false
    default: 'false'
  summary-mode:
    description: Summary mode for validate, lint, trivy, checkov, test, plan, and apply. Allowed values are `full`, `redacted`, and `off`.
    required: false
    default: redacted
  comment-mode:
    description: PR comment mode. Use `sticky` to update a single comment or `off` to disable comments.
    required: false
    default: sticky
  comment-identifier:
    description: Identifier used to find and update sticky PR comments.
    required: false
    default: tf-github-action

outputs:
  env:
    description: The provided deployment label.
    value: ${{ steps.run.outputs.env }}
  env_slug:
    description: Sanitized deployment label used in artifacts and comment markers.
    value: ${{ steps.run.outputs.env_slug }}
  selected_steps:
    description: Normalized comma-delimited step list.
    value: ${{ steps.run.outputs.selected_steps }}
  has_failures:
    description: Whether any selected step failed.
    value: ${{ steps.run.outputs.has_failures }}
  validate_status:
    description: Validate step status.
    value: ${{ steps.run.outputs.validate_status }}
  lint_status:
    description: Lint step status.
    value: ${{ steps.run.outputs.lint_status }}
  trivy_status:
    description: Trivy step status.
    value: ${{ steps.run.outputs.trivy_status }}
  checkov_status:
    description: Checkov step status.
    value: ${{ steps.run.outputs.checkov_status }}
  test_status:
    description: Test step status.
    value: ${{ steps.run.outputs.test_status }}
  plan_status:
    description: Plan step status.
    value: ${{ steps.run.outputs.plan_status }}
  apply_status:
    description: Apply step status.
    value: ${{ steps.run.outputs.apply_status }}
  has_changes:
    description: Whether the plan detected changes.
    value: ${{ steps.run.outputs.has_changes }}
  create_count:
    description: Planned creates.
    value: ${{ steps.run.outputs.create_count }}
  update_count:
    description: Planned updates.
    value: ${{ steps.run.outputs.update_count }}
  destroy_count:
    description: Planned destroys.
    value: ${{ steps.run.outputs.destroy_count }}
  plan_artifact_name:
    description: Uploaded plan artifact name.
    value: ${{ steps.run.outputs.plan_artifact_name }}
  plan_artifact_sha256:
    description: SHA256 digest of the generated plan artifact.
    value: ${{ steps.run.outputs.plan_artifact_sha256 }}
  added:
    description: Applied creates.
    value: ${{ steps.run.outputs.added }}
  changed:
    description: Applied updates.
    value: ${{ steps.run.outputs.changed }}
  destroyed:
    description: Applied destroys.
    value: ${{ steps.run.outputs.destroyed }}
  imported:
    description: Applied imports.
    value: ${{ steps.run.outputs.imported }}
  forgotten:
    description: Applied forgets.
    value: ${{ steps.run.outputs.forgotten }}

runs:
  using: composite
  steps:
    - name: Preflight
      id: preflight
      shell: bash
      run: node "$GITHUB_ACTION_PATH/dist/preflight/index.js"
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_WORKDIR: ${{ inputs.workdir }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_STEPS: ${{ inputs.steps }}
        INPUT_TFVAR_FILES: ${{ inputs['tfvar-files'] }}
        INPUT_TFVARS: ${{ inputs.tfvars }}
        INPUT_BACKEND_CONFIG_VAR_FILES: ${{ inputs['backend-config-var-files'] }}
        INPUT_BACKEND_CONFIG_VARS: ${{ inputs['backend-config-vars'] }}
        INPUT_TEST_DIR: ${{ inputs['test-dir'] }}
        INPUT_TEST_TFVAR_FILES: ${{ inputs['test-tfvar-files'] }}
        INPUT_TEST_TFVARS: ${{ inputs['test-tfvars'] }}
        INPUT_TFLINT_VERSION: ${{ inputs['tflint-version'] }}
        INPUT_TRIVY_VERSION: ${{ inputs['trivy-version'] }}
        INPUT_CHECKOV_VERSION: ${{ inputs['checkov-version'] }}
        INPUT_TRIVY_SCAN_TYPE: ${{ inputs['trivy-scan-type'] }}
        INPUT_CHECKOV_SKIP_CHECKS: ${{ inputs['checkov-skip-checks'] }}
        INPUT_LOCK_TIMEOUT: ${{ inputs['lock-timeout'] }}
        INPUT_PARALLELISM: ${{ inputs.parallelism }}
        INPUT_REFRESH: ${{ inputs.refresh }}
        INPUT_TARGETS: ${{ inputs.targets }}
        INPUT_ARTIFACT_RETENTION_DAYS: ${{ inputs['artifact-retention-days'] }}
        INPUT_SKIP_PLAN_UPLOAD: ${{ inputs['skip-plan-upload'] }}
        INPUT_SUMMARY_MODE: ${{ inputs['summary-mode'] }}
        INPUT_COMMENT_MODE: ${{ inputs['comment-mode'] }}
        INPUT_COMMENT_IDENTIFIER: ${{ inputs['comment-identifier'] }}

    - name: Setup OpenTofu
      if: ${{ steps.preflight.outputs.run_validate == 'true' || steps.preflight.outputs.run_plan == 'true' || steps.preflight.outputs.run_apply == 'true' || steps.preflight.outputs.run_test == 'true' }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/install-opentofu.sh"
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_TOFU_CHECKSUMS: ${{ inputs['tofu-checksums'] }}

    - name: Install TFLint
      if: ${{ steps.preflight.outputs.run_lint == 'true' }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/install-tflint.sh"
      env:
        INPUT_TFLINT_VERSION: ${{ inputs['tflint-version'] }}
        INPUT_TFLINT_CHECKSUMS: ${{ inputs['tflint-checksums'] }}

    - name: Install Trivy
      if: ${{ steps.preflight.outputs.run_trivy == 'true' }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/install-trivy.sh"
      env:
        INPUT_TRIVY_VERSION: ${{ inputs['trivy-version'] }}
        INPUT_TRIVY_CHECKSUMS: ${{ inputs['trivy-checksums'] }}

    - name: Setup Python
      if: ${{ steps.preflight.outputs.run_checkov == 'true' }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.12'

    - name: Install Checkov
      if: ${{ steps.preflight.outputs.run_checkov == 'true' }}
      shell: bash
      run: |
        if [ "$INPUT_CHECKOV_VERSION" != "3.2.497" ]; then
          echo "Custom checkov-version values are not supported until a matching hash-locked requirements file is added."
          exit 1
        fi
        python -m venv "$RUNNER_TEMP/tofu-checkov-venv"
        "$RUNNER_TEMP/tofu-checkov-venv/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r "$GITHUB_ACTION_PATH/security/checkov/requirements-py312-linux-x86_64.txt"
        echo "$RUNNER_TEMP/tofu-checkov-venv/bin" >> "$GITHUB_PATH"
      env:
        INPUT_CHECKOV_VERSION: ${{ inputs['checkov-version'] }}

    - name: Download Plan Artifact
      if: ${{ steps.preflight.outputs.run_apply == 'true' && steps.preflight.outputs.run_plan != 'true' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ steps.preflight.outputs.plan_artifact_name }}
        path: ${{ inputs.workdir }}
      # Silence DEP0005 Buffer() noise — @actions/artifact (v8.0.1,
      # current latest) still uses the legacy Buffer() constructor.
      # Upstream bug, not ours; suppress until a fix ships.
      env:
        NODE_NO_WARNINGS: "1"

    - name: Run Tofu GitHub Action
      id: run
      shell: bash
      run: |
        export PATH="${RUNNER_TEMP:-/tmp}/tofu-github-action/bin:${RUNNER_TEMP:-/tmp}/tofu-checkov-venv/bin:$PATH"
        node "$GITHUB_ACTION_PATH/dist/main/index.js"
      env:
        GITHUB_TOKEN: ${{ github.token }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_WORKDIR: ${{ inputs.workdir }}
        INPUT_ENV: ${{ inputs.env }}
        INPUT_STEPS: ${{ inputs.steps }}
        INPUT_TFVAR_FILES: ${{ inputs['tfvar-files'] }}
        INPUT_TFVARS: ${{ inputs.tfvars }}
        INPUT_BACKEND_CONFIG_VAR_FILES: ${{ inputs['backend-config-var-files'] }}
        INPUT_BACKEND_CONFIG_VARS: ${{ inputs['backend-config-vars'] }}
        INPUT_TEST_DIR: ${{ inputs['test-dir'] }}
        INPUT_TEST_TFVAR_FILES: ${{ inputs['test-tfvar-files'] }}
        INPUT_TEST_TFVARS: ${{ inputs['test-tfvars'] }}
        INPUT_TFLINT_VERSION: ${{ inputs['tflint-version'] }}
        INPUT_TRIVY_VERSION: ${{ inputs['trivy-version'] }}
        INPUT_CHECKOV_VERSION: ${{ inputs['checkov-version'] }}
        INPUT_TRIVY_SCAN_TYPE: ${{ inputs['trivy-scan-type'] }}
        INPUT_CHECKOV_SKIP_CHECKS: ${{ inputs['checkov-skip-checks'] }}
        INPUT_LOCK_TIMEOUT: ${{ inputs['lock-timeout'] }}
        INPUT_PARALLELISM: ${{ inputs.parallelism }}
        INPUT_REFRESH: ${{ inputs.refresh }}
        INPUT_TARGETS: ${{ inputs.targets }}
        INPUT_ARTIFACT_RETENTION_DAYS: ${{ inputs['artifact-retention-days'] }}
        INPUT_SKIP_PLAN_UPLOAD: ${{ inputs['skip-plan-upload'] }}
        INPUT_SUMMARY_MODE: ${{ inputs['summary-mode'] }}
        INPUT_COMMENT_MODE: ${{ inputs['comment-mode'] }}
        INPUT_COMMENT_IDENTIFIER: ${{ inputs['comment-identifier'] }}

    - name: Upload Plan Artifact
      if: ${{ steps.preflight.outputs.run_plan == 'true' && inputs['skip-plan-upload'] != 'true' && steps.run.outputs.plan_artifact_name != '' && inputs['artifact-retention-days'] == '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.run.outputs.plan_artifact_name }}
        path: ${{ inputs.workdir }}/${{ steps.run.outputs.plan_artifact_name }}*
        if-no-files-found: error
      env:
        NODE_NO_WARNINGS: "1"

    - name: Upload Plan Artifact With Retention
      if: ${{ steps.preflight.outputs.run_plan == 'true' && inputs['skip-plan-upload'] != 'true' && steps.run.outputs.plan_artifact_name != '' && inputs['artifact-retention-days'] != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.run.outputs.plan_artifact_name }}
        path: ${{ inputs.workdir }}/${{ steps.run.outputs.plan_artifact_name }}*
        if-no-files-found: error
        retention-days: ${{ inputs['artifact-retention-days'] }}
      env:
        NODE_NO_WARNINGS: "1"
